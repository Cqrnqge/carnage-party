<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0710" />
  <title>Трансляция · Carnage Party</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060b;
      --panel: rgba(18, 13, 25, 0.92);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f7f3fb;
      --muted: #a49bab;
      --accent: #e047d2;
      --accent-2: #7c3aed;
      --live: #ff3d5f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(900px 520px at 50% -10%, rgba(224, 71, 210, 0.18), transparent 65%), var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .shell { height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      background: linear-gradient(180deg, rgba(12, 8, 17, 0.96), rgba(12, 8, 17, 0.66));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      z-index: 3;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff3d71, #d946ef 55%, #7c3aed);
      box-shadow: 0 8px 22px rgba(224, 71, 210, 0.35);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-text strong { font-size: 14px; letter-spacing: 0.3px; }
    .brand-text span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; }
    .divider { width: 1px; height: 30px; background: var(--border); flex: none; }
    .stream-meta { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
    .stream-meta-text { min-width: 0; }
    .stream-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stream-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      background: linear-gradient(135deg, #ff3d71, #7c3aed);
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--live);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1px;
      flex: none;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .viewers {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      flex: none;
    }
    .viewers svg { width: 15px; height: 15px; }
    .open-app {
      flex: none;
      text-decoration: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease;
    }
    .open-app:hover { background: rgba(255, 255, 255, 0.11); }
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 110px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.62));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .stage.playing::after { opacity: 1; }
    .status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px;
      text-align: center;
      background:
        radial-gradient(700px 420px at 50% 35%, rgba(124, 58, 237, 0.2), transparent 70%),
        #08060b;
      z-index: 5;
    }
    .status.hidden { display: none; }
    .status h2 { margin: 0; font-size: clamp(20px, 3vw, 30px); }
    .status p { margin: 0; color: var(--muted); max-width: 520px; line-height: 1.5; font-size: 14px; }
    .spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: linear-gradient(135deg, rgba(255, 61, 113, 0.22), rgba(124, 58, 237, 0.22));
      border: 1px solid var(--border);
    }
    .player-controls {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border-radius: 11px;
      background: rgba(8, 6, 11, 0.7);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .ctrl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 36px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .ctrl:hover { background: rgba(255, 255, 255, 0.13); }
    .ctrl svg { width: 17px; height: 17px; }
    .sound-hint {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 3, 7, 0.42);
      cursor: pointer;
    }
    .sound-hint.hidden { display: none; }
    .sound-hint button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 28px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(12, 8, 17, 0.82);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
    }
    .sound-hint button:hover { background: rgba(30, 20, 40, 0.92); }
    .sound-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff3d71, #7c3aed);
      box-shadow: 0 10px 30px rgba(224, 71, 210, 0.4);
    }
    .sound-icon svg { width: 25px; height: 25px; }
    .footer-note {
      position: absolute;
      left: 16px;
      bottom: 18px;
      z-index: 3;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: none;
    }
    .footer-note b { color: rgba(255, 255, 255, 0.8); font-weight: 600; }

    /* Чат трансляции. Положение задаёт стример из приложения. */
    .chat {
      position: absolute;
      z-index: 4;
      display: flex;
      flex-direction: column;
      min-width: 160px;
      min-height: 120px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      background: rgba(9, 7, 13, 0.78);
      color: #fff;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }
    .chat-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
    }
    .chat-head strong {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
    }
    .chat-head svg { width: 14px; height: 14px; }
    .chat-self {
      margin-left: auto;
      max-width: 62%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.55);
      font-size: 9.5px;
    }
    .chat-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 7px 9px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .chat-msg {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
      font-size: 11.5px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .chat-author {
      color: #f0b3ff;
      font-size: 9.5px;
      font-weight: 700;
    }
    .chat-msg.guest .chat-author { color: #9fb7d8; }
    .chat-text { color: rgba(255, 255, 255, 0.9); }
    .chat-empty {
      margin: auto;
      padding: 10px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 10.5px;
      text-align: center;
    }
    .chat-form {
      flex: none;
      display: flex;
      gap: 5px;
      padding: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.22);
    }
    .chat-form input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      outline: none;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font: inherit;
      font-size: 11px;
    }
    .chat-form input:focus { border-color: rgba(224, 71, 210, 0.55); }
    .chat-form input::placeholder { color: rgba(255, 255, 255, 0.38); }
    .chat-form input:disabled { opacity: 0.5; }
    .chat-form button {
      display: grid;
      place-items: center;
      width: 30px;
      flex: none;
      border: 0;
      border-radius: 7px;
      background: linear-gradient(135deg, #ff3d71, #d946ef 55%, #7c3aed);
      color: #fff;
      cursor: pointer;
    }
    .chat-form button svg { width: 15px; height: 15px; }
    .chat-form .chat-emoji-btn {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.82);
    }
    .chat.chat-style-light .chat-form .chat-emoji-btn {
      border-color: rgba(20, 14, 28, 0.16);
      background: rgba(20, 14, 28, 0.06);
      color: #1c1722;
    }
    .chat.chat-style-gold .chat-form button.chat-emoji-btn {
      border-color: rgba(246, 196, 83, 0.32);
      background: rgba(246, 196, 83, 0.12);
      color: #ffe3a1;
    }

    /* Компактный выбор смайлов для публичной страницы. */
    .emoji-pop {
      position: fixed;
      z-index: 60;
      display: flex;
      flex-direction: column;
      width: 272px;
      height: 238px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(12, 9, 17, 0.97);
      color: #fff;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
    }
    .emoji-pop[hidden] { display: none; }
    .emoji-pop-tabs {
      flex: none;
      display: flex;
      gap: 2px;
      padding: 1px 1px 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .emoji-pop-tabs::-webkit-scrollbar { display: none; }
    .emoji-pop-tab {
      flex: none;
      width: 30px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.65;
    }
    .emoji-pop-tab:hover { background: rgba(255, 255, 255, 0.1); opacity: 1; }
    .emoji-pop-tab.active { background: rgba(224, 71, 210, 0.24); opacity: 1; }
    .emoji-pop-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 1px;
      align-content: start;
      padding: 2px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .emoji-pop-cell {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
    }
    .emoji-pop-cell:hover { background: rgba(255, 255, 255, 0.12); }

    /* Стили чата, выбранные стримером в студии. */
    .chat.chat-style-light {
      border-color: rgba(20, 14, 28, 0.14);
      background: rgba(248, 247, 250, 0.95);
      color: #1c1722;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
    }
    .chat.chat-style-light .chat-head {
      border-bottom-color: rgba(20, 14, 28, 0.1);
      background: rgba(20, 14, 28, 0.05);
    }
    .chat.chat-style-light .chat-self { color: rgba(28, 23, 34, 0.58); }
    .chat.chat-style-light .chat-author { color: #9c2bb5; }
    .chat.chat-style-light .chat-msg.guest .chat-author { color: #416a9c; }
    .chat.chat-style-light .chat-text { color: #2b2333; }
    .chat.chat-style-light .chat-empty { color: rgba(28, 23, 34, 0.45); }
    .chat.chat-style-light .chat-form {
      border-top-color: rgba(20, 14, 28, 0.1);
      background: rgba(20, 14, 28, 0.04);
    }
    .chat.chat-style-light .chat-form input {
      border-color: rgba(20, 14, 28, 0.16);
      background: #ffffff;
      color: #1c1722;
    }
    .chat.chat-style-light .chat-form input::placeholder { color: rgba(28, 23, 34, 0.42); }

    .chat.chat-style-neon {
      border-color: rgba(255, 77, 240, 0.8);
      background: rgba(6, 3, 18, 0.84);
      box-shadow:
        0 0 0 1px rgba(125, 249, 255, 0.18) inset,
        0 0 26px rgba(255, 77, 240, 0.42),
        0 16px 38px rgba(0, 0, 0, 0.55);
    }
    .chat.chat-style-neon .chat-head {
      border-bottom-color: rgba(125, 249, 255, 0.2);
      background: linear-gradient(90deg, rgba(255, 77, 240, 0.22), rgba(77, 224, 255, 0.14));
    }
    .chat.chat-style-neon .chat-head strong {
      color: #ffd9ff;
      text-shadow: 0 0 10px rgba(255, 77, 240, 0.9);
    }
    .chat.chat-style-neon .chat-author {
      color: #7df9ff;
      text-shadow: 0 0 8px rgba(125, 249, 255, 0.55);
    }
    .chat.chat-style-neon .chat-msg.guest .chat-author { color: #b9a6ff; }
    .chat.chat-style-neon .chat-text {
      color: #f5f1ff;
      text-shadow: 0 0 8px rgba(125, 249, 255, 0.22);
    }
    .chat.chat-style-neon .chat-empty { color: rgba(199, 235, 255, 0.55); }
    .chat.chat-style-neon .chat-form {
      border-top-color: rgba(255, 77, 240, 0.22);
      background: rgba(255, 77, 240, 0.08);
    }
    .chat.chat-style-neon .chat-form input {
      border-color: rgba(125, 249, 255, 0.36);
      background: rgba(125, 249, 255, 0.07);
      color: #f5f1ff;
    }
    .chat.chat-style-neon .chat-form input:focus {
      border-color: #7df9ff;
      box-shadow: 0 0 12px rgba(125, 249, 255, 0.3);
    }

    .chat.chat-style-gold {
      border-color: rgba(246, 196, 83, 0.66);
      background: linear-gradient(160deg, rgba(35, 28, 13, 0.93), rgba(15, 12, 6, 0.92));
      box-shadow:
        0 0 0 1px rgba(246, 196, 83, 0.12) inset,
        0 0 24px rgba(246, 196, 83, 0.22),
        0 16px 38px rgba(0, 0, 0, 0.58);
    }
    .chat.chat-style-gold .chat-head {
      border-bottom-color: rgba(246, 196, 83, 0.3);
      background: rgba(246, 196, 83, 0.14);
    }
    .chat.chat-style-gold .chat-head strong { color: #ffe3a1; }
    .chat.chat-style-gold .chat-author { color: #ffd66e; }
    .chat.chat-style-gold .chat-msg.guest .chat-author { color: #d8c18a; }
    .chat.chat-style-gold .chat-text { color: #fdf6e3; }
    .chat.chat-style-gold .chat-empty { color: rgba(253, 246, 227, 0.48); }
    .chat.chat-style-gold .chat-form {
      border-top-color: rgba(246, 196, 83, 0.3);
      background: rgba(246, 196, 83, 0.08);
    }
    .chat.chat-style-gold .chat-form input {
      border-color: rgba(246, 196, 83, 0.32);
      background: rgba(246, 196, 83, 0.08);
      color: #fdf6e3;
    }
    .chat.chat-style-gold .chat-form input:focus { border-color: rgba(246, 196, 83, 0.8); }
    .chat.chat-style-gold .chat-form button {
      background: linear-gradient(135deg, #f6c453, #b8860b);
      color: #221a09;
    }

    .chat.chat-style-minimal {
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(9, 7, 13, 0.78);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(9px);
      text-shadow: none;
    }
    .chat.chat-style-minimal .chat-head {
      border-bottom-color: rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
    }
    .chat.chat-style-minimal .chat-author { color: #ffffff; }
    .chat.chat-style-minimal .chat-msg.guest .chat-author { color: rgba(255, 255, 255, 0.78); }
    .chat.chat-style-minimal .chat-text { color: #ffffff; }
    .chat.chat-style-minimal .chat-empty { color: rgba(255, 255, 255, 0.6); }
    .chat.chat-style-minimal .chat-form {
      border-top-color: rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.24);
      padding: 6px;
    }
    .chat.chat-style-minimal .chat-form input {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
    }

    .stage:fullscreen,
    .stage.fullscreen {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }
    .stage:fullscreen #player,
    .stage.fullscreen #player {
      width: 100%;
      height: 100%;
    }
    .stage:fullscreen .footer-note,
    .stage.fullscreen .footer-note { bottom: 16px; }

    @media (max-width: 720px) {
      .topbar { padding: 9px 10px; gap: 9px; }
      .brand-text, .divider, .open-app, .viewers span { display: none; }
      .stream-title { font-size: 13.5px; }
      .stream-sub { font-size: 11px; }
      .player-controls { right: 9px; bottom: 9px; }
      .footer-note { display: none; }
      .sound-hint button { padding: 16px 20px; }
      .chat {
        left: 8px !important;
        top: auto !important;
        bottom: 56px !important;
        width: calc(100% - 16px) !important;
        height: 38% !important;
      }
      .chat-head, .chat-list, .chat-form { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" title="Carnage Party">
        <span class="brand-mark">CP</span>
        <span class="brand-text">
          <strong>Carnage Party</strong>
          <span>Streaming</span>
        </span>
      </a>
      <span class="divider"></span>
      <div class="stream-meta">
        <span class="avatar" id="owner-avatar">?</span>
        <div class="stream-meta-text">
          <h1 class="stream-title" id="stream-title">Трансляция</h1>
          <div class="stream-sub">
            <span id="owner-name">Подключаемся…</span>
            <span>·</span>
            <span id="source-label">видео</span>
          </div>
        </div>
      </div>
      <span class="live-pill"><span class="live-dot"></span> LIVE</span>
      <span class="viewers" title="Зрители">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewers">0</span>
      </span>
      <a class="open-app" href="/">Открыть Carnage Party</a>
    </header>

    <main class="stage" id="stage">
      <video id="player" autoplay playsinline muted></video>

      <div class="status" id="status">

        <h2 id="status-title">Подключаемся к трансляции…</h2>

        <button type="button" id="sound-btn">
          <span class="sound-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 5-6 4H2v6h3l6 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </span>
          Смотреть со звуком
        </button>
      </div>

      <div class="footer-note"><b>Carnage Party</b> · прямая трансляция</div>

      <div class="player-controls">
        <button class="ctrl" type="button" id="mute-btn" title="Звук">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 5-6 4H2v6h3l6 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>

        </button>
        <button class="ctrl" type="button" id="fullscreen-btn" title="На весь экран">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>

      <div class="chat" id="chat">
        <div class="chat-head">
          <strong>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Чат
          </strong>
          <span class="chat-self" id="chat-self">Гость</span>
        </div>
        <div class="chat-list" id="chat-list">
          <div class="chat-empty" id="chat-empty">Пока тихо. Напишите первым!</div>
        </div>
        <form class="chat-form" id="chat-form">
          <button class="chat-emoji-btn" type="button" id="chat-emoji-btn" aria-label="Смайлы" title="Смайлы" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <input id="chat-input" maxlength="500" placeholder="Написать в чат…" autocomplete="off" aria-label="Сообщение в чат трансляции" />
          <button type="submit" aria-label="Отправить сообщение">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </form>
      </div>

      <div class="emoji-pop" id="emoji-pop" hidden>
        <div class="emoji-pop-tabs" id="emoji-pop-tabs"></div>
        <div class="emoji-pop-grid" id="emoji-pop-grid"></div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function () {
      'use strict';
      var ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }];
      var ICE_EXPIRES_AT = 0;
      function refreshIce() {
        if (ICE_EXPIRES_AT > Date.now() + 30000) return Promise.resolve();
        return fetch('/api/ice?userId=stream-viewer', { cache: 'no-store' })
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (data) {
            var servers = data && Array.isArray(data.iceServers) ? data.iceServers : null;
            if (servers && servers.length) ICE_SERVERS = servers;
            var ttl = data && Number(data.ttl) || 0;
            ICE_EXPIRES_AT = Date.now() + (ttl > 0 ? Math.max(300000, ttl * 1000 - 60000) : 3600000);
          })
          .catch(function () { ICE_EXPIRES_AT = Date.now() + 300000; });
      }
      refreshIce();
      var streamId = (location.pathname.split('/').filter(Boolean).pop() || '').replace(/[^a-z0-9_-]/gi, '');
      var player = document.getElementById('player');
      var stage = document.getElementById('stage');
      var statusBox = document.getElementById('status');
      var spinner = document.getElementById('spinner');
      var statusTitle = document.getElementById('status-title');
      var statusText = document.getElementById('status-text');
      var soundHint = document.getElementById('sound-hint');
      var soundBtn = document.getElementById('sound-btn');
      var muteBtn = document.getElementById('mute-btn');
      var muteLabel = document.getElementById('mute-label');
      var fullscreenBtn = document.getElementById('fullscreen-btn');
      var viewersEl = document.getElementById('viewers');
      var titleEl = document.getElementById('stream-title');
      var ownerEl = document.getElementById('owner-name');
      var ownerAvatar = document.getElementById('owner-avatar');
      var sourceLabel = document.getElementById('source-label');
      var chatEl = document.getElementById('chat');
      var chatListEl = document.getElementById('chat-list');
      var chatEmptyEl = document.getElementById('chat-empty');
      var chatFormEl = document.getElementById('chat-form');
      var chatInputEl = document.getElementById('chat-input');
      var chatSelfEl = document.getElementById('chat-self');
      var chatEmojiBtn = document.getElementById('chat-emoji-btn');
      var emojiPopEl = document.getElementById('emoji-pop');
      var emojiTabsEl = document.getElementById('emoji-pop-tabs');
      var emojiGridEl = document.getElementById('emoji-pop-grid');

      var socket = null;
      var pc = null;
      var hostId = null;
      var remote = new MediaStream();
      var pendingCandidates = [];
      var ended = false;
      var soundStarted = false;
      var chatMessages = [];
      var chatSelf = null;

      var GUEST_KEY = 'carnage_stream_guest_name';
      var DEFAULT_CHAT_LAYOUT = { x: 0.64, y: 0.06, w: 0.33, h: 0.48 };
      var guestName = '';
      var authToken = '';
      try {
        guestName = localStorage.getItem(GUEST_KEY) || '';
        authToken = localStorage.getItem('carnage_token') || '';
      } catch (err) {}
      if (!/^Guest#\d{4}$/.test(guestName)) {
        guestName = 'Guest#' + String(Math.floor(1000 + Math.random() * 9000));
        try { localStorage.setItem(GUEST_KEY, guestName); } catch (err) {}
      }

      function showStatus(title, text, loading) {
        statusBox.classList.remove('hidden');
        statusTitle.textContent = title;
        statusText.textContent = text || '';
        spinner.style.display = loading ? 'block' : 'none';
      }

      function hideStatus() {
        statusBox.classList.add('hidden');
      }

      function initials(name) {
        return String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (part) {
          return part.charAt(0).toUpperCase();
        }).join('') || '?';
      }

      function renderInfo(info) {
        if (!info) return;
        titleEl.textContent = info.title || 'Трансляция';
        ownerEl.textContent = (info.owner && (info.owner.displayName || info.owner.username)) || 'Неизвестный';
        ownerAvatar.textContent = initials(ownerEl.textContent);
        if (info.owner && info.owner.avatar) {
          var url = /^https?:\/\//i.test(info.owner.avatar) ? info.owner.avatar : info.owner.avatar;
          ownerAvatar.innerHTML = '<img alt="" src="' + url.replace(/"/g, '&quot;') + '">';
        }
        sourceLabel.textContent =
          info.source === 'both'
            ? 'экран + камера'
            : info.source === 'screen'
              ? 'демонстрация экрана'
              : 'камера';
        viewersEl.textContent = String(info.viewers || 0);
        if (info.chatLayout) applyChatLayout(info.chatLayout);
        applyChatStyle(info.chatStyle);
        document.title = (info.title || 'Трансляция') + ' · Carnage Party';
      }

      var CHAT_STYLES = ['dark', 'light', 'neon', 'gold', 'minimal'];

      function applyChatStyle(style) {
        var next = CHAT_STYLES.indexOf(String(style || '')) !== -1 ? String(style) : 'dark';
        chatEl.className = 'chat chat-style-' + next;
      }

      function applyChatLayout(layout) {
        var source = layout || DEFAULT_CHAT_LAYOUT;
        var number = function (value, fallback) {
          var parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : fallback;
        };
        var w = Math.min(0.85, Math.max(0.16, number(source.w, DEFAULT_CHAT_LAYOUT.w)));
        var h = Math.min(0.88, Math.max(0.18, number(source.h, DEFAULT_CHAT_LAYOUT.h)));
        var x = Math.min(0.995 - w, Math.max(0.005, number(source.x, DEFAULT_CHAT_LAYOUT.x)));
        var y = Math.min(0.995 - h, Math.max(0.005, number(source.y, DEFAULT_CHAT_LAYOUT.y)));
        chatEl.style.left = (x * 100) + '%';
        chatEl.style.top = (y * 100) + '%';
        chatEl.style.width = (w * 100) + '%';
        chatEl.style.height = (h * 100) + '%';
        scrollChatToBottom();
      }

      function setChatSelf(user) {
        chatSelf = user || null;
        if (!user) {
          chatSelfEl.textContent = 'Гость';
          return;
        }
        chatSelfEl.textContent = 'Вы: ' + (user.name || 'Гость');
        if (user.guest && user.name) {
          guestName = user.name;
          try { localStorage.setItem(GUEST_KEY, user.name); } catch (err) {}
        }
      }

      function hideChatEmpty() {
        if (chatEmptyEl && chatEmptyEl.parentNode) chatEmptyEl.parentNode.removeChild(chatEmptyEl);
        chatEmptyEl = null;
      }

      function scrollChatToBottom() {
        if (!chatListEl) return;
        chatListEl.scrollTop = chatListEl.scrollHeight;
        requestAnimationFrame(function () {
          chatListEl.scrollTop = chatListEl.scrollHeight;
          requestAnimationFrame(function () {
            chatListEl.scrollTop = chatListEl.scrollHeight;
          });
        });
      }

      function appendChatMessage(message) {
        if (!message || !message.text) return;
        if (message.id && chatMessages.some(function (item) { return item.id === message.id; })) return;
        hideChatEmpty();
        chatMessages.push(message);
        if (chatMessages.length > 100) chatMessages.shift();
        var row = document.createElement('div');
        row.className = 'chat-msg' + (message.user && message.user.guest ? ' guest' : '');
        var author = document.createElement('span');
        author.className = 'chat-author';
        author.textContent = (message.user && message.user.name) || 'Гость';
        var text = document.createElement('span');
        text.className = 'chat-text';
        text.textContent = message.text;
        row.appendChild(author);
        row.appendChild(text);
        chatListEl.appendChild(row);
        while (chatListEl.children.length > 100) chatListEl.removeChild(chatListEl.firstChild);
        scrollChatToBottom();
      }

      function renderChatHistory(messages, self) {
        chatListEl.innerHTML = '';
        chatMessages = [];
        chatEmptyEl = null;
        setChatSelf(self);
        var list = Array.isArray(messages) ? messages : [];
        for (var i = 0; i < list.length; i += 1) appendChatMessage(list[i]);
        if (!list.length) {
          chatEmptyEl = document.createElement('div');
          chatEmptyEl.className = 'chat-empty';
          chatEmptyEl.textContent = 'Пока тихо. Напишите первым!';
          chatListEl.appendChild(chatEmptyEl);
        }
      }

      function closePeer() {
        if (!pc) return;
        try {
          pc.onicecandidate = null;
          pc.ontrack = null;
          pc.onconnectionstatechange = null;
          pc.close();
        } catch (err) {}
        pc = null;
      }

      function endPlayback(title, text) {
        ended = true;
        closePeer();
        player.srcObject = null;
        showStatus(title || 'Трансляция завершена', text || 'Стример остановил эфир.', false);
        soundHint.classList.add('hidden');
        stage.classList.remove('playing');
        chatInputEl.disabled = true;
        chatInputEl.placeholder = 'Трансляция завершена';
        chatEmojiBtn.disabled = true;
        closeEmojiPop();
      }

      function startSound() {
        soundStarted = true;
        player.muted = false;
        player.play().catch(function () {});
        soundHint.classList.add('hidden');
        muteLabel.textContent = 'Выкл. звук';
      }

      soundBtn.addEventListener('click', startSound);
      soundHint.addEventListener('click', startSound);

      muteBtn.addEventListener('click', function () {
        if (!soundStarted) {
          startSound();
          return;
        }
        player.muted = !player.muted;
        muteLabel.textContent = player.muted ? 'Звук' : 'Выкл. звук';
      });

      chatFormEl.addEventListener('submit', function (event) {
        event.preventDefault();
        if (ended || !socket) return;
        var value = String(chatInputEl.value || '')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 500);
        if (!value) return;
        socket.emit('stream:chat', { text: value });
        chatInputEl.value = '';
      });

      // Компактный выбор смайлов для зрителей публичной страницы.
      var EMOJI_GROUPS = [
        {
          id: 'smileys',
          icon: '😀',
          emojis: '😀 😃 😄 😁 😆 😅 😂 🤣 🥲 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🥳 😏 😒 😔 😟 😕 🙁 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🫣 🤭 🤫 🫢 🫡 🤥 😶 😐 😑 😬 🙄 😯 😮 😲 🥱 😴 🤤 😪 😵 🤐 🥴 🤢 🤮 🤧 😷 🤒 🤕 🤑 🤠 😈 😺'.split(' '),
        },
        {
          id: 'people',
          icon: '👋',
          emojis: '👋 🤚 🖐️ ✋ 🖖 👌 🤌 🤏 ✌️ 🤞 🫰 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ 👍 👎 ✊ 👊 🤛 🤜 👏 🙌 🫶 👐 🤲 🤝 🙏 💪 🦾 🫵 🖕 ✍️ 💅 🤳 👀 🧠 👶 🧒 👦 👧 🧑 👨 👩 🧓 👴 👵 🧑‍💻 👨‍💻 👩‍💻 🕺 💃 👯 🫂 🎅 🤶 🦸 🦹 🧙'.split(' '),
        },
        {
          id: 'nature',
          icon: '🐻',
          emojis: '🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐒 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🪲 🦋 🐌 🐞 🐜 🕷️ 🐢 🐍 🦎 🐙 🦑 🦐 🦞 🦀 🐡 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐅 🐆 🦓 🦍 🐘 🦒 🦘 🐄 🐖 🐑 🦌 🐕 🐈 🌵 🎄 🌲 🌳 🌴 🌱 🌿 ☘️ 🍀 🌷 🌹 🌺 🌸 🌼 🌻 🌞 🌙 ⭐ 🌟 ✨ ⚡ 🔥 🌈 ☀️ ❄️ ⛄ 🌊'.split(' '),
        },
        {
          id: 'food',
          icon: '🍔',
          emojis: '🍏 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🍆 🥑 🥦 🥬 🥒 🌶️ 🌽 🥕 🥔 🍠 🥐 🥯 🍞 🥖 🥨 🧀 🥚 🍳 🥞 🥓 🥩 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🥙 🌮 🌯 🥗 🥘 🍝 🍜 🍲 🍛 🍣 🍱 🥟 🍤 🍙 🍚 🍘 🍥 🥮 🍢 🍡 🍧 🍨 🍦 🥧 🧁 🍰 🎂 🍮 🍭 🍬 🍫 🍿 🍩 🍪 🌰 🥜 ☕ 🍵 🧃 🥤 🧋 🍶 🍺 🍻 🥂 🍷 🥃 🍸 🍹 🧉 🍾 🧊'.split(' '),
        },
        {
          id: 'activities',
          icon: '🎮',
          emojis: '⚽ 🏀 🏈 ⚾ 🥎 🎾 🏐 🏉 🥏 🎱 🪀 🏓 🏸 🏒 🏑 🥍 🏏 🥅 ⛳ 🪁 🏹 🎣 🤿 🥊 🥋 🎽 🛹 🛼 🛷 ⛸️ 🥌 🎿 🏂 🪂 🏋️ 🤼 🤸 ⛹️ 🤺 🤾 🏌️ 🏇 🧘 🏄 🏊 🤽 🚣 🧗 🚵 🚴 🏆 🥇 🥈 🥉 🏅 🎖️ 🏵️ 🎗️ 🎫 🎟️ 🎪 🤹 🎭 🩰 🎨 🎬 🎤 🎧 🎼 🎹 🥁 🪘 🎷 🎺 🎸 🪕 🎻 🎲 🎯 🎳 🎮 🕹️ 🎰 🧩 🪩 🎉 🎊 🎈 🎁 🎀 🪄 🎃'.split(' '),
        },
        {
          id: 'symbols',
          icon: '❤️',
          emojis: '❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 ☮️ ✝️ ☪️ 🕉️ ☸️ ✡️ 🔱 ⚛️ ☯️ ✴️ 🆚 💮 💯 💢 ♨️ 🚷 🚯 ⛔ 📛 🚫 ⚠️ 🚸 ♻️ ✅ ❇️ ✳️ ❎ 🌐 💠 🌀 💤 👑 💀 ☠️ 🤖 👻 🎃 🎅 💩 🚀 💻 📱 💡 📷 📺 📻 🎙️ 🔋 🔌 💰 💳 💎 🔧 🔨 🛡️ ⚔️ 🔮 📿 🧿'.split(' '),
        },
      ];

      var emojiGroup = EMOJI_GROUPS[0];

      function renderEmojiGroup(group) {
        emojiGroup = group;
        emojiTabsEl.innerHTML = '';
        EMOJI_GROUPS.forEach(function (item) {
          var tab = document.createElement('button');
          tab.type = 'button';
          tab.className = 'emoji-pop-tab' + (item.id === group.id ? ' active' : '');
          tab.textContent = item.icon;
          tab.title = item.id;
          tab.addEventListener('click', function () { renderEmojiGroup(item); });
          emojiTabsEl.appendChild(tab);
        });
        emojiGridEl.innerHTML = '';
        group.emojis.forEach(function (emoji) {
          var cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'emoji-pop-cell';
          cell.textContent = emoji;
          cell.addEventListener('click', function () { insertChatEmoji(emoji); });
          emojiGridEl.appendChild(cell);
        });
        emojiGridEl.scrollTop = 0;
      }

      function insertChatEmoji(emoji) {
        var start = chatInputEl.selectionStart == null ? chatInputEl.value.length : chatInputEl.selectionStart;
        var end = chatInputEl.selectionEnd == null ? chatInputEl.value.length : chatInputEl.selectionEnd;
        var next = (chatInputEl.value.slice(0, start) + emoji + chatInputEl.value.slice(end)).slice(0, 500);
        chatInputEl.value = next;
        chatInputEl.focus();
        var position = Math.min(start + emoji.length, next.length);
        try { chatInputEl.setSelectionRange(position, position); } catch (err) {}
      }

      function closeEmojiPop() {
        emojiPopEl.hidden = true;
        chatEmojiBtn.setAttribute('aria-expanded', 'false');
      }

      function toggleEmojiPop() {
        if (emojiPopEl.hidden) {
          var rect = chatEmojiBtn.getBoundingClientRect();
          var width = Math.min(272, window.innerWidth - 16);
          var height = Math.min(238, Math.max(150, window.innerHeight - 16));
          emojiPopEl.style.width = width + 'px';
          emojiPopEl.style.height = height + 'px';
          emojiPopEl.style.left =
            Math.max(8, Math.min(window.innerWidth - width - 8, rect.left)) + 'px';
          var top = rect.top - height - 8;
          if (top < 8) top = Math.min(window.innerHeight - height - 8, rect.bottom + 8);
          emojiPopEl.style.top = Math.max(8, top) + 'px';
          emojiPopEl.hidden = false;
          chatEmojiBtn.setAttribute('aria-expanded', 'true');
          renderEmojiGroup(emojiGroup);
        } else {
          closeEmojiPop();
        }
      }

      chatEmojiBtn.addEventListener('click', function (event) {
        event.stopPropagation();
        toggleEmojiPop();
      });

      document.addEventListener('mousedown', function (event) {
        if (emojiPopEl.hidden) return;
        if (emojiPopEl.contains(event.target) || chatEmojiBtn.contains(event.target)) return;
        closeEmojiPop();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !emojiPopEl.hidden) closeEmojiPop();
      });

      window.addEventListener('resize', closeEmojiPop);
      window.addEventListener('resize', scrollChatToBottom);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(scrollChatToBottom).observe(chatListEl);
      }

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
      }

      function syncFullscreenState() {
        var active = Boolean(fullscreenElement());
        stage.classList.toggle('fullscreen', active);
        fullscreenBtn.title = active ? 'Свернуть' : 'На весь экран';
      }

      fullscreenBtn.addEventListener('click', function () {
        var target = stage;
        var active = fullscreenElement();
        if (active) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (exit) {
            try {
              var result = exit.call(document);
              if (result && result.catch) result.catch(function () {});
            } catch (err) {}
          }
          return;
        }
        var request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
        if (request) {
          try {
            var requestResult = request.call(target, { navigationUI: 'hide' });
            if (requestResult && requestResult.catch) {
              requestResult.catch(function () {
                if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
              });
            }
          } catch (err) {
            if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
          }
        } else if (player.webkitEnterFullscreen) {
          player.webkitEnterFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', syncFullscreenState);
      document.addEventListener('webkitfullscreenchange', syncFullscreenState);
      document.addEventListener('MSFullscreenChange', syncFullscreenState);

      player.addEventListener('playing', function () {
        if (ended) return;
        hideStatus();
        stage.classList.add('playing');
        if (!soundStarted) soundHint.classList.remove('hidden');
      });

      player.addEventListener('volumechange', function () {
        muteLabel.textContent = player.muted ? 'Звук' : 'Выкл. звук';
      });

      async function createPeer(offerFrom) {
        await refreshIce();
        closePeer();
        remote = new MediaStream();
        pendingCandidates = [];
        pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        pc.ontrack = function (event) {
          if (event.streams && event.streams[0]) {
            remote = event.streams[0];
          } else {
            remote.addTrack(event.track);
          }
          if (player.srcObject !== remote) {
            player.srcObject = remote;
            player.play().catch(function () {});
          }
        };
        pc.onicecandidate = function (event) {
          if (!event.candidate || !socket) return;
          socket.emit('stream:signal', {
            to: offerFrom,
            data: { candidate: event.candidate },
          });
        };
        pc.onconnectionstatechange = function () {
          if (!pc) return;
          if (pc.connectionState === 'connected' && !ended) {
            hideStatus();
          }
          if (pc.connectionState === 'failed') {
            showStatus('Не удалось соединиться', 'Проверьте интернет и попробуйте обновить страницу.', false);
          }
        };
        return pc;
      }

      async function handleSignal(payload) {
        if (!payload || !payload.data) return;
        var data = payload.data;
        var from = payload.from;
        try {
          if (data.type === 'offer') {
            hostId = from;
            var connection = await createPeer(from);
            await connection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            for (var i = 0; i < pendingCandidates.length; i += 1) {
              try { await connection.addIceCandidate(new RTCIceCandidate(pendingCandidates[i])); } catch (err) {}
            }
            pendingCandidates = [];
            var answer = await connection.createAnswer();
            await connection.setLocalDescription(answer);
            socket.emit('stream:signal', {
              to: from,
              data: { type: 'answer', sdp: connection.localDescription },
            });
          } else if (data.candidate) {
            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
              try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (err) {}
            } else {
              pendingCandidates.push(data.candidate);
            }
          }
        } catch (err) {
          console.warn('[stream] signal error', err);
        }
      }

      function connect() {
        if (!streamId) {
          showStatus('Ссылка неверна', 'В адресе нет идентификатора трансляции.', false);
          return;
        }
        socket = io('/stream', {
          auth: {
            streamId: streamId,
            role: 'viewer',
            token: authToken,
            guestName: guestName,
          },
          transports: ['websocket', 'polling'],
          reconnection: true,
          reconnectionDelay: 800,
          reconnectionDelayMax: 4000,
        });

        socket.on('stream:ready', function (payload) {
          if (!payload) return;
          renderInfo(payload.stream);
          hostId = payload.hostId || hostId;
          if (payload.hostId) {
            showStatus('Подключаемся к трансляции…', 'Получаем видеопоток от стримера.', true);
          } else {
            showStatus('Ждём стримера…', 'Стример ещё подключается. Страница обновится автоматически.', true);
          }
        });

        socket.on('stream:viewers', function (payload) {
          viewersEl.textContent = String((payload && payload.viewers) || 0);
        });

        socket.on('stream:chat-history', function (payload) {
          if (!payload) return;
          renderChatHistory(payload.messages, payload.self);
        });

        socket.on('stream:chat', appendChatMessage);

        socket.on('stream:chat-layout', function (payload) {
          if (payload && payload.layout) applyChatLayout(payload.layout);
        });

        socket.on('stream:chat-style', function (payload) {
          if (payload && payload.style) applyChatStyle(payload.style);
        });

        socket.on('stream:signal', handleSignal);

        socket.on('stream:error', function (payload) {
          endPlayback('Трансляция недоступна', (payload && payload.error) || 'Возможно, эфир уже завершён.');
        });

        socket.on('stream:ended', function () {
          endPlayback('Трансляция завершена', 'Стример остановил эфир. Спасибо, что смотрели!');
        });

        socket.on('connect_error', function () {
          if (ended) return;
          showStatus('Нет соединения с сервером', 'Проверьте интернет — страница переподключится автоматически.', true);
        });

        socket.on('disconnect', function (reason) {
          if (ended || reason === 'io client disconnect') return;
          showStatus('Связь потеряна', 'Пробуем переподключиться к трансляции…', true);
        });
      }

      applyChatLayout(DEFAULT_CHAT_LAYOUT);
      connect();
    })();
  </script>
</body>
</html>
